<text x="196" y="161" fill="#B8A0EA" font-family="Inter,Arial,Helvetica,sans-serif" font-size="20" font-weight="750" letter-spacing="2.2">03  /  DESIGN IDEAS</text>
<text x="192" y="257" fill="#F8F7FC" font-family="Inter,Arial,Helvetica,sans-serif" font-size="63" font-weight="740" letter-spacing="-2.0">Details with character.</text>
<text x="197" y="302" fill="#B7C1D0" font-family="Inter,Arial,Helvetica,sans-serif" font-size="25">Custom heads can add personality to Minecraft builds.</text>
