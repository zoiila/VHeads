<text x="226" y="399" fill="#B8A0EA" font-family="Inter,Arial,Helvetica,sans-serif" font-size="18" font-weight="780" letter-spacing="1.2">01</text>
<text x="282" y="398" fill="#F8F7FC" font-family="Inter,Arial,Helvetica,sans-serif" font-size="27" font-weight="720">Distinctive details</text>
<text x="282" y="430" fill="#B7C1D0" font-family="Inter,Arial,Helvetica,sans-serif" font-size="18">A small accent can give a room character.</text>
<rect x="194" y="463" width="666" height="90" rx="4" fill="#161C27"/>
<rect x="194" y="463" width="5" height="90" fill="#B8A0EA"/>
<text x="226" y="500" fill="#B8A0EA" font-family="Inter,Arial,Helvetica,sans-serif" font-size="18" font-weight="780" letter-spacing="1.2">02</text>
<text x="282" y="499" fill="#F8F7FC" font-family="Inter,Arial,Helvetica,sans-serif" font-size="27" font-weight="720">Themed spaces</text>
<text x="282" y="531" fill="#B7C1D0" font-family="Inter,Arial,Helvetica,sans-serif" font-size="18">Choose details to match the build's theme.</text>
<rect x="194" y="564" width="666" height="90" rx="4" fill="#161C27"/>
<rect x="194" y="564" width="5" height="90" fill="#D2DBE6"/>
<text x="226" y="601" fill="#D2DBE6" font-family="Inter,Arial,Helvetica,sans-serif" font-size="18" font-weight="780" letter-spacing="1.2">03</text>
<text x="282" y="600" fill="#F8F7FC" font-family="Inter,Arial,Helvetica,sans-serif" font-size="27" font-weight="720">Creative touches</text>
<text x="282" y="632" fill="#B7C1D0" font-family="Inter,Arial,Helvetica,sans-serif" font-size="18">Let important details stand out.</text>
