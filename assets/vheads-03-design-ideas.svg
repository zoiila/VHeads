<rect x="886" y="362" width="556" height="292" rx="5" fill="#161C27" stroke="#50596B" stroke-width="1.5"/>
<text x="922" y="408" fill="#B8A0EA" font-family="Inter,Arial,Helvetica,sans-serif" font-size="18" font-weight="760" letter-spacing="1.6">THE DESIGN PRINCIPLE</text>
<path d="M920 424H1401" stroke="#4B5263" stroke-width="1.5"/>
<text x="921" y="475" fill="#F8F7FC" font-family="Inter,Arial,Helvetica,sans-serif" font-size="31" font-weight="720">Make every head count.</text>
<text x="923" y="515" fill="#B7C1D0" font-family="Inter,Arial,Helvetica,sans-serif" font-size="19">Choose textures that suit the build.</text>
<text x="923" y="543" fill="#B7C1D0" font-family="Inter,Arial,Helvetica,sans-serif" font-size="19">Avoid visual clutter and repetition.</text>
